<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Czat 5A</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1a1a22;
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .mini-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .scrollable {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #profileView {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .profile-avatar-preview {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #listView { display: none; flex-direction: column; height: 100%; }
        #chatRoomView { display: none; flex-direction: column; height: 100%; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #16161c;
            cursor: pointer;
        }

        .chat-avatar {
            width: 50px; 
            height: 50px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin-right: 15px; 
            font-weight: bold;
            font-size: 20px;
        }

        .messages-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            position: relative;
            background: #18181d;
            padding: 10px 14px;
            border-radius: 16px;
            width: fit-content;
            max-width: 80%;
            min-width: 140px;
            font-size: 15px;
            word-break: break-word;
            align-self: flex-start;
            cursor: pointer;
            touch-action: manipulation;
        }

        .message .author {
            font-size: 11px;
            color: #00ffaa;
            margin-bottom: 4px;
            font-weight: bold;
        }
        
        .message.my { 
            background: #8a2be2 !important; 
            align-self: flex-end !important; 
        }
        .message.my .author { 
            color: #ffffff !important; 
        }

        .audio-player-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            width: 100%;
        }

        .audio-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .audio-text {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        .reactions-container {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .reaction-pill {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message.my .reaction-pill {
            background: rgba(0, 0, 0, 0.3);
        }

        .emoji-picker-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .emoji-picker-bar {
            background: #1e1e26;
            border: 1px solid #3a3a48;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: popUp 0.15s ease-out;
        }

        .emoji-picker-bar span {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .emoji-picker-bar span:active {
            transform: scale(1.4);
        }

        @keyframes popUp {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #131318;
            border-top: 1px solid #22222a;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }

        input {
            background: #18181d;
            border: 1px solid #2a2a33;
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            font-size: 16px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .profile-input {
            width: 80%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 20px;
        }

        .chat-input {
            flex: 1;
        }

        button {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .mic-btn {
            background: #2a2a33;
            padding: 12px 14px;
            border-radius: 50%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #3a3a48;
        }

        .mic-btn.recording {
            background: #ff3b30;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 1. WIDOK WYBORU NICKU -->
        <div id="profileView">
            <div class="profile-avatar-preview" id="previewLetter">?</div>
            <h2>Wpisz swój nick</h2>
            <input type="text" id="nameInput" class="profile-input" placeholder="np. H" oninput="updatePreview(this.value)">
            <button onclick="saveProfile()">Wejdź na czat</button>
        </div>

        <!-- 2. LISTA CZATÓW -->
        <div id="listView">
            <div class="header"><span>Czat 5A</span></div>
            <div class="scrollable">
                <div class="chat-item" onclick="openChat()">
                    <div class="chat-avatar" id="listAvatar">T</div>
                    <div>
                        <strong>Torty</strong>
                        <div style="font-size:12px; color:#00ffaa;">SZYFROWANE E2EE</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. ROZMOWA -->
        <div id="chatRoomView">
            <div class="header">
                <span onclick="closeChat()" style="cursor:pointer; font-size: 14px;">← Powrót</span>
                
                <div class="header-center">
                    <div class="mini-avatar" id="roomMiniAvatar">?</div>
                    <span id="roomMyName" style="font-weight: bold; color: #fff;">-</span>
                </div>

                <span style="font-size: 12px; color: #b0b0b0;">5A</span>
            </div>
            <div class="scrollable messages-container" id="messages"></div>
            <div class="chat-input-area">
                <div class="mic-btn" id="micBtn" onclick="toggleRecording()" title="Nagraj głosówkę">🎤</div>
                <input type="text" id="messageInput" class="chat-input" placeholder="Napisz wiadomość...">
                <button onclick="sendMessage()">Wyślij</button>
            </div>
        </div>
    </div>

    <!-- MODAL WYBORU REAKCJI -->
    <div id="emojiPickerModal" class="emoji-picker-modal" onclick="closeEmojiPicker()">
        <div class="emoji-picker-bar" onclick="event.stopPropagation()">
            <span onclick="sendReaction('❤️')">❤️</span>
            <span onclick="sendReaction('😂')">😂</span>
            <span onclick="sendReaction('😮')">😮</span>
            <span onclick="sendReaction('😢')">😢</span>
            <span onclick="sendReaction('👍')">👍</span>
            <span onclick="sendReaction('🔥')">🔥</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js?v=99"></script>
    <script>
        const socket = io();
        let selectedMessageId = null;
        
        let myId = localStorage.getItem('chat_userid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('chat_userid', myId);
        }

        let myName = localStorage.getItem('chat_username') || '';

        window.onload = () => {
            if (myName && myName.trim() !== '' && myName !== 'Użytkownik' && myName !== 'Anonim' && myName !== 'Kolega') {
                document.getElementById('profileView').style.display = 'none';
                document.getElementById('listView').style.display = 'flex';
                setupUserInterface();
            } else {
                document.getElementById('profileView').style.display = 'flex';
                document.getElementById('listView').style.display = 'none';
            }
        };

        function updatePreview(val) {
            const firstLetter = val.trim().charAt(0).toUpperCase() || '?';
            document.getElementById('previewLetter').textContent = firstLetter;
        }

        function saveProfile() {
            const input = document.getElementById('nameInput');
            const val = input.value.trim();
            if (!val) {
                alert('Wpisz nick!');
                return;
            }
            myName = val;
            localStorage.setItem('chat_username', myName);
            
            document.getElementById('profileView').style.display = 'none';
            document.getElementById('listView').style.display = 'flex';
            setupUserInterface();
        }

        function setupUserInterface() {
            const firstLetter = myName.charAt(0).toUpperCase();
            document.getElementById('roomMiniAvatar').textContent = firstLetter;
            document.getElementById('roomMyName').textContent = myName;
        }

        function openChat() { 
            document.getElementById('listView').style.display = 'none'; 
            document.getElementById('chatRoomView').style.display = 'flex';
            scrollToBottom();
        }

        function closeChat() { 
            document.getElementById('chatRoomView').style.display = 'none'; 
            document.getElementById('listView').style.display = 'flex'; 
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function renderReactions(msgDiv, reactions) {
            let reactionsDiv = msgDiv.querySelector('.reactions-container');
            if (!reactionsDiv) {
                reactionsDiv = document.createElement('div');
                reactionsDiv.className = 'reactions-container';
                msgDiv.appendChild(reactionsDiv);
            }

            reactionsDiv.innerHTML = '';
            if (!reactions || Object.keys(reactions).length === 0) {
                reactionsDiv.style.display = 'none';
                return;
            }

            reactionsDiv.style.display = 'flex';
            const counts = {};
            Object.values(reactions).forEach(e => counts[e] = (counts[e] || 0) + 1);

            for (const [emoji, count] of Object.entries(counts)) {
                const pill = document.createElement('span');
                pill.className = 'reaction-pill';
                pill.textContent = `${emoji} ${count > 1 ? count : ''}`.trim();
                reactionsDiv.appendChild(pill);
            }
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.dataset.id = msg.id;
            
            const isMyMessage = (msg.userId && msg.userId === myId);

            let authorName = msg.author;
            if (isMyMessage) {
                authorName = myName;
                div.classList.add('my');
            } else {
                if (!authorName || authorName === 'Użytkownik' || authorName === 'Anonim') {
                    authorName = 'Kolega';
                }
            }

            const authorDiv = document.createElement('div');
            authorDiv.className = 'author';
            authorDiv.textContent = authorName;
            div.appendChild(authorDiv);

            if (msg.type === 'audio' || msg.audioData) {
                const audioPlayer = document.createElement('div');
                audioPlayer.className = 'audio-player-box';

                const playIcon = document.createElement('span');
                playIcon.className = 'audio-icon';
                playIcon.textContent = '▶️';

                const playText = document.createElement('span');
                playText.className = 'audio-text';
                playText.textContent = 'Odtwórz głosówkę';

                audioPlayer.appendChild(playIcon);
                audioPlayer.appendChild(playText);

                const audioElement = new Audio(msg.audioData);
                
                audioPlayer.onclick = (e) => {
                    e.stopPropagation();
                    if (audioElement.paused) {
                        audioElement.play().then(() => {
                            playIcon.textContent = '⏸️';
                            playText.textContent = 'Zatrzymaj';
                        }).catch(err => {
                            alert('Brak możliwości odtworzenia audio.');
                        });
                    } else {
                        audioElement.pause();
                        playIcon.textContent = '▶️';
                        playText.textContent = 'Odtwórz głosówkę';
                    }
                };

                audioElement.onended = () => {
                    playIcon.textContent = '▶️';
                    playText.textContent = 'Odtwórz głosówkę';
                };

                div.appendChild(audioPlayer);
            } else {
                const textDiv = document.createElement('div');
                textDiv.textContent = msg.text || (typeof msg === 'string' ? msg : '');
                div.appendChild(textDiv);
            }

            renderReactions(div, msg.reactions);

            let pressTimer;
            div.addEventListener('touchstart', () => {
                pressTimer = setTimeout(() => openEmojiPicker(msg.id), 400);
            }, { passive: true });

            div.addEventListener('touchend', () => clearTimeout(pressTimer));
            div.addEventListener('touchmove', () => clearTimeout(pressTimer));
            
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                openEmojiPicker(msg.id);
            });

            container.appendChild(div);
            scrollToBottom();
        }

        function openEmojiPicker(msgId) {
            selectedMessageId = msgId;
            document.getElementById('emojiPickerModal').style.display = 'flex';
        }

        function closeEmojiPicker() {
            selectedMessageId = null;
            document.getElementById('emojiPickerModal').style.display = 'none';
        }

        function sendReaction(emoji) {
            if (selectedMessageId) {
                socket.emit('react-message', {
                    messageId: selectedMessageId,
                    emoji: emoji,
                    userId: myId
                });
            }
            closeEmojiPicker();
        }

        socket.on('history', (history) => {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            history.forEach(msg => {
                appendMessage(msg);
            });
        });

        socket.on('message', (msg) => {
            appendMessage(msg);
        });

        socket.on('message-reaction-updated', ({ messageId, reactions }) => {
            const msgDiv = document.querySelector(`[data-id="${messageId}"]`);
            if (msgDiv) {
                renderReactions(msgDiv, reactions);
            }
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            myName = localStorage.getItem('chat_username') || document.getElementById('roomMyName').textContent;
            if (!myName || myName === '-') {
                myName = 'H';
            }

            if (text) {
                socket.emit('message', { 
                    text: text, 
                    author: myName,
                    userId: myId,
                    type: 'text'
                });
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const micBtn = document.getElementById('micBtn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    let mimeType = 'audio/webm';
                    if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                    } else if (MediaRecorder.isTypeSupported('audio/aac')) {
                        mimeType = 'audio/aac';
                    }

                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            myName = localStorage.getItem('chat_username') || 'H';
                            
                            socket.emit('message', {
                                audioData: base64Audio,
                                author: myName,
                                userId: myId,
                                type: 'audio'
                            });
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.title = "Zakończ nagrywanie";
                } catch (err) {
                    alert('Brak dostępu do mikrofonu lub przeglądarka blokuje nagrywanie!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.title = "Nagraj głosówkę";
                
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
