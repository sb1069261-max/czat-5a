<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Czat 5A</title>
    <style>
        /* Naprawa przewijania i responsywności */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed; /* Zapobiega "odbijaniu" strony przy scrollowaniu */
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #1a1a22;
            flex-shrink: 0;
        }

        /* Naprawione przewijanie jednym palcem */
        .scrollable {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Kluczowe dla płynnego scrolla na iOS */
        }

        #listView { display: flex; flex-direction: column; height: 100%; }
        #chatRoomView { display: none; flex-direction: column; height: 100%; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #16161c;
            cursor: pointer;
        }

        .chat-avatar {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 15px; font-weight: bold;
        }

        .messages-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: #18181d;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 15px;
        }
        
        .message.my { background: #8a2be2; align-self: flex-end; }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #131318;
            border-top: 1px solid #22222a;
            gap: 10px;
            flex-shrink: 0;
        }

        input {
            flex: 1;
            background: #18181d;
            border: 1px solid #2a2a33;
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            font-size: 16px; /* 16px zapobiega zoomowaniu na iOS przy klikaniu */
            outline: none;
        }

        button {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- LISTA CZATÓW -->
        <div id="listView">
            <div class="header"><span>Czat 5A</span></div>
            <div class="scrollable">
                <div class="chat-item" onclick="openChat()">
                    <div class="chat-avatar">C5</div>
                    <div><strong>Czat 5A</strong><div style="font-size:12px; color:#00ffaa;">SZYFROWANE</div></div>
                </div>
            </div>
        </div>

        <!-- ROZMOWA -->
        <div id="chatRoomView">
            <div class="header"><span onclick="closeChat()">← Powrót</span></div>
            <div class="scrollable messages-container" id="messages">
                <div class="message">Witaj w Czat 5A!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Napisz wiadomość...">
                <button onclick="sendMessage()">Wyślij</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function openChat() { document.getElementById('listView').style.display = 'none'; document.getElementById('chatRoomView').style.display = 'flex'; }
        function closeChat() { document.getElementById('chatRoomView').style.display = 'none'; document.getElementById('listView').style.display = 'flex'; }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (input.value.trim()) {
                socket.emit('chat message', input.value);
                const msg = document.createElement('div');
                msg.className = 'message my';
                msg.textContent = input.value;
                document.getElementById('messages').appendChild(msg);
                input.value = '';
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
        }
        socket.on('chat message', (msg) => {
            const div = document.createElement('div');
            div.className = 'message';
            div.textContent = msg;
            document.getElementById('messages').appendChild(div);
        });
    </script>
</body>
</html>
