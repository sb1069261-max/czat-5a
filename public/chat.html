<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Czat 5A</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #1a1a22;
            flex-shrink: 0;
        }

        .scrollable {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #profileView {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .profile-avatar-preview {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #listView { display: none; flex-direction: column; height: 100%; }
        #chatRoomView { display: none; flex-direction: column; height: 100%; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #16161c;
            cursor: pointer;
        }

        .chat-avatar {
            width: 50px; 
            height: 50px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin-right: 15px; 
            font-weight: bold;
            font-size: 20px;
        }

        .messages-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: #18181d;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 15px;
            word-break: break-word;
        }

        .message .author {
            font-size: 11px;
            color: #00ffaa;
            margin-bottom: 3px;
            font-weight: bold;
        }
        
        .message.my { background: #8a2be2; align-self: flex-end; }
        .message.my .author { color: #ffffff; }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #131318;
            border-top: 1px solid #22222a;
            gap: 10px;
            flex-shrink: 0;
        }

        input {
            background: #18181d;
            border: 1px solid #2a2a33;
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .profile-input {
            width: 80%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 20px;
        }

        .chat-input {
            flex: 1;
        }

        button {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 1. WIDOK PROFILU -->
        <div id="profileView">
            <div class="profile-avatar-preview" id="previewLetter">?</div>
            <h2>Wpisz swoje imię</h2>
            <input type="text" id="nameInput" class="profile-input" placeholder="np. Paweł lub H" oninput="updatePreview(this.value)">
            <button onclick="saveProfile()">Wejdź na czat</button>
        </div>

        <!-- 2. LISTA CZATÓW -->
        <div id="listView">
            <div class="header"><span>Czat 5A</span></div>
            <div class="scrollable">
                <div class="chat-item" onclick="openChat()">
                    <div class="chat-avatar" id="listAvatar">?</div>
                    <div>
                        <strong id="listUsername">Czat 5A</strong>
                        <div style="font-size:12px; color:#00ffaa;">SZYFROWANE E2EE</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. ROZMOWA -->
        <div id="chatRoomView">
            <div class="header">
                <span onclick="closeChat()" style="cursor:pointer;">← Powrót</span>
                <span style="font-size: 14px; color: #b0b0b0;" id="roomTitle">Czat 5A</span>
            </div>
            <div class="scrollable messages-container" id="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" class="chat-input" placeholder="Napisz wiadomość...">
                <button onclick="sendMessage()">Wyślij</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Zawsze pobieramy imię z pamięci telefonu
        let myName = localStorage.getItem('chat_username') || '';

        window.onload = () => {
            if (myName && myName.trim() !== '') {
                document.getElementById('profileView').style.display = 'none';
                document.getElementById('listView').style.display = 'flex';
                setupUserInterface();
            }
        };

        function updatePreview(val) {
            const firstLetter = val.trim().charAt(0).toUpperCase() || '?';
            document.getElementById('previewLetter').textContent = firstLetter;
        }

        function saveProfile() {
            const input = document.getElementById('nameInput');
            const val = input.value.trim();
            if (!val) {
                alert('Wpisz imię!');
                return;
            }
            myName = val;
            localStorage.setItem('chat_username', myName);
            
            document.getElementById('profileView').style.display = 'none';
            document.getElementById('listView').style.display = 'flex';
            setupUserInterface();
        }

        function setupUserInterface() {
            const firstLetter = myName.charAt(0).toUpperCase();
            document.getElementById('listAvatar').textContent = firstLetter;
            document.getElementById('listUsername').textContent = myName;
        }

        function openChat() { 
            document.getElementById('listView').style.display = 'none'; 
            document.getElementById('chatRoomView').style.display = 'flex';
            scrollToBottom();
        }

        function closeChat() { 
            document.getElementById('chatRoomView').style.display = 'none'; 
            document.getElementById('listView').style.display = 'flex'; 
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            
            // Wyciągamy autora (jeśli brak w bazie, bierzemy aktualne imię lub Anonim)
            const authorName = msg.author || myName || 'Anonim';

            if (authorName === myName) {
                div.classList.add('my');
            }

            const authorDiv = document.createElement('div');
            authorDiv.className = 'author';
            authorDiv.textContent = authorName;
            
            const textDiv = document.createElement('div');
            textDiv.textContent = msg.text || msg; // Obsługa starych wiadomości tekstowych

            div.appendChild(authorDiv);
            div.appendChild(textDiv);
            container.appendChild(div);
            scrollToBottom();
        }

        socket.on('history', (history) => {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            history.forEach(msg => {
                appendMessage(msg);
            });
        });

        socket.on('message', (msg) => {
            appendMessage(msg);
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            // Upewniamy się, że mamy imię przed wysłaniem
            if (!myName) {
                myName = localStorage.getItem('chat_username') || 'Anonim';
            }

            if (text) {
                socket.emit('message', { 
                    text: text, 
                    author: myName 
                });
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
