<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Czat 5A</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1a1a22;
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .mini-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .scrollable {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #profileView {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .profile-avatar-preview {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #listView { display: none; flex-direction: column; height: 100%; }
        #chatRoomView { display: none; flex-direction: column; height: 100%; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #16161c;
            cursor: pointer;
        }

        .chat-avatar {
            width: 50px; 
            height: 50px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin-right: 15px; 
            font-weight: bold;
            font-size: 20px;
        }

        .messages-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: #18181d;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 15px;
            word-break: break-word;
            align-self: flex-start;
        }

        .message .author {
            font-size: 11px;
            color: #00ffaa;
            margin-bottom: 3px;
            font-weight: bold;
        }
        
        .message.my { 
            background: #8a2be2; 
            align-self: flex-end; 
        }
        .message.my .author { 
            color: #ffffff; 
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #131318;
            border-top: 1px solid #22222a;
            gap: 10px;
            flex-shrink: 0;
        }

        input {
            background: #18181d;
            border: 1px solid #2a2a33;
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .profile-input {
            width: 80%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 20px;
        }

        .chat-input {
            flex: 1;
        }

        button {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 1. WIDOK WYBORU NICKU -->
        <div id="profileView">
            <div class="profile-avatar-preview" id="previewLetter">?</div>
            <h2>Wpisz swój nick</h2>
            <input type="text" id="nameInput" class="profile-input" placeholder="np. H" oninput="updatePreview(this.value)">
            <button onclick="saveProfile()">Wejdź na czat</button>
        </div>

        <!-- 2. LISTA CZATÓW -->
        <div id="listView">
            <div class="header"><span>Czat 5A</span></div>
            <div class="scrollable">
                <div class="chat-item" onclick="openChat()">
                    <div class="chat-avatar" id="listAvatar">T</div>
                    <div>
                        <strong>Torty</strong>
                        <div style="font-size:12px; color:#00ffaa;">SZYFROWANE E2EE</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. ROZMOWA -->
        <div id="chatRoomView">
            <div class="header">
                <span onclick="closeChat()" style="cursor:pointer; font-size: 14px;">← Powrót</span>
                
                <div class="header-center">
                    <div class="mini-avatar" id="roomMiniAvatar">?</div>
                    <span id="roomMyName" style="font-weight: bold; color: #fff;">-</span>
                </div>

                <span style="font-size: 12px; color: #b0b0b0;">5A</span>
            </div>
            <div class="scrollable messages-container" id="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" class="chat-input" placeholder="Napisz wiadomość...">
                <button onclick="sendMessage()">Wyślij</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        let myId = localStorage.getItem('chat_userid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('chat_userid', myId);
        }

        let myName = localStorage.getItem('chat_username') || '';

        window.onload = () => {
            if (myName && myName.trim() !== '' && myName !== 'Użytkownik' && myName !== 'Anonim') {
                document.getElementById('profileView').style.display = 'none';
                document.getElementById('listView').style.display = 'flex';
                setupUserInterface();
            } else {
                document.getElementById('profileView').style.display = 'flex';
                document.getElementById('listView').style.display = 'none';
            }
        };

        function updatePreview(val) {
            const firstLetter = val.trim().charAt(0).toUpperCase() || '?';
            document.getElementById('previewLetter').textContent = firstLetter;
        }

        function saveProfile() {
            const input = document.getElementById('nameInput');
            const val = input.value.trim();
            if (!val) {
                alert('Wpisz nick!');
                return;
            }
            myName = val;
            localStorage.setItem('chat_username', myName);
            
            document.getElementById('profileView').style.display = 'none';
            document.getElementById('listView').style.display = 'flex';
            setupUserInterface();
        }

        function setupUserInterface() {
            const firstLetter = myName.charAt(0).toUpperCase();
            document.getElementById('roomMiniAvatar').textContent = firstLetter;
            document.getElementById('roomMyName').textContent = myName;
        }

        function openChat() { 
            document.getElementById('listView').style.display = 'none'; 
            document.getElementById('chatRoomView').style.display = 'flex';
            scrollToBottom();
        }

        function closeChat() { 
            document.getElementById('chatRoomView').style.display = 'none'; 
            document.getElementById('listView').style.display = 'flex'; 
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            
            let authorName = msg.author;
            if (msg.userId === myId) {
                authorName = myName;
            } else if (!authorName || authorName === 'Użytkownik' || authorName === 'Anonim') {
                authorName = 'Kolega';
            }

            const isMyMessage = (msg.userId && msg.userId === myId) || (authorName === myName);

            if (isMyMessage) {
                div.classList.add('my');
            }

            const authorDiv = document.createElement('div');
            authorDiv.className = 'author';
            authorDiv.textContent = authorName;
            
            const textDiv = document.createElement('div');
            textDiv.textContent = msg.text || msg;

            div.appendChild(authorDiv);
            div.appendChild(textDiv);
            container.appendChild(div);
            scrollToBottom();
        }

        socket.on('history', (history) => {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            history.forEach(msg => {
                appendMessage(msg);
            });
        });

        socket.on('message', (msg) => {
            appendMessage(msg);
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            myName = localStorage.getItem('chat_username') || document.getElementById('roomMyName').textContent;
            if (!myName || myName === '-') {
                myName = 'H';
            }

            if (text) {
                socket.emit('message', { 
                    text: text, 
                    author: myName,
                    userId: myId 
                });
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
