<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prywatny Czat E2EE</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    #chat { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; height: 90vh; }
    #messages { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; flex-direction: column; }
    .msg { margin: 5px 0; padding: 8px 12px; border-radius: 5px; background: #222; max-width: 80%; word-break: break-word; }
    .my-msg { background: #007bff; align-self: flex-end; }
    form { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 10px 20px; border: none; background: #28a745; color: #fff; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Napisz wiadomość..." />
      <button type="submit">Wyślij</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    if (!window.location.hash) {
      window.location.hash = 'room-' + Math.random().toString(36).substring(2, 9);
    }
    const roomId = window.location.hash;

    socket.emit('join-room', roomId);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        const text = input.value;
        addMessage(text, true);
        socket.emit('chat-message', { room: roomId, text: text });
        input.value = '';
      }
    });

    socket.on('chat-message', (data) => {
      addMessage(data.text, false);
    });

    function addMessage(text, isMine) {
      const item = document.createElement('div');
      item.classList.add('msg');
      if (isMine) item.classList.add('my-msg');
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
