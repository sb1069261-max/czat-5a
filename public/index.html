<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --msg-me: #4f46e5;
      --msg-other: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Animated Burger Background */
    .food-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .food-item { position: absolute; font-size: 2.5rem; opacity: 0.2; animation: float 14s infinite linear; }
    @keyframes float { 0% { transform: translateY(105vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }

    .screen { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; width: 100%; }
    .hidden { display: none !important; }

    /* Entry Screen with Burger Pattern Background */
    #start-screen { 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      background-color: #0f172a;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px), radial-gradient(rgba(255, 255, 255, 0.05) 2px, #0f172a 2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }
    .start-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 36px 24px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6); text-align: center; }
    .start-card h1 { font-size: 1.6rem; margin-bottom: 10px; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .start-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 26px; font-weight: 500; }
    
    .btn-main { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; font-weight: 600; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 14px rgba(99,102,241,0.4); transition: all 0.2s; }
    .btn-main:active { transform: scale(0.97); }

    /* Nickname Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 10; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .modal { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 24px; border-radius: 20px; width: 100%; max-width: 320px; text-align: center; }
    .modal h3 { margin-bottom: 12px; font-size: 1.2rem; }
    .modal input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; margin-bottom: 16px; outline: none; }
    .modal input:focus { border-color: var(--accent); }

    /* Chat Screen Layout */
    header { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .room-title { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
    .btn-icon { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }

    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; position: relative; font-size: 0.95rem; line-height: 1.4; animation: pop 0.15s ease-out; }
    @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .msg.other { background: var(--msg-other); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.me { background: var(--msg-me); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
    
    .msg .author { font-size: 0.7rem; font-weight: 700; color: #cbd5e1; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .msg.me .author { color: #c7d2fe; text-align: right; }

    footer { padding: 12px 16px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
    footer input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 24px; color: #fff; font-size: 0.95rem; outline: none; }
    footer input:focus { border-color: var(--accent); }
    .btn-send { background: var(--accent); border: none; width: 44px; height: 44px; border-radius: 50%; color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s; }
    .btn-send:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <!-- Floating Burger Animations -->
  <div class="food-bg">
    <div class="food-item" style="left: 8%; animation-duration: 11s;">🍔</div>
    <div class="food-item" style="left: 30%; animation-duration: 15s; animation-delay: 2s;">🍔</div>
    <div class="food-item" style="left: 58%; animation-duration: 13s; animation-delay: 4s;">🍔</div>
    <div class="food-item" style="left: 82%; animation-duration: 17s; animation-delay: 1s;">🍔</div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <div class="start-card">
      <h1>Prywatny Czat</h1>
      <p>każdy chuj ma swój strój</p>
      <button class="btn-main" id="enter-btn">🎂 TYLKO TORTY</button>
    </div>
  </div>

  <!-- Nick Modal -->
  <div id="nick-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Ustaw Twój podpis</h3>
      <input type="text" id="nick-input" placeholder="np. P lub Piotrek" maxlength="10">
      <button class="btn-main" id="save-nick-btn">Przejdź do czatu</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="room-title">
        <span class="status-dot"></span>
        <span>Szyfrowany Czat</span>
      </div>
      <button class="btn-icon" id="change-nick-btn">👤 <span id="current-nick-display">?</span></button>
    </header>
    <div id="messages"></div>
    <footer>
      <input type="text" id="msg-input" placeholder="Napisz wiadomość...">
      <button class="btn-send" id="send-btn">➤</button>
    </footer>
  </div>

  <script>
    const socket = io();
    let cryptoKey = null;

    const startScreen = document.getElementById('start-screen');
    const nickModal = document.getElementById('nick-modal');
    const chatScreen = document.getElementById('chat-screen');
    const nickInput = document.getElementById('nick-input');
    const enterBtn = document.getElementById('enter-btn');
    const saveNickBtn = document.getElementById('save-nick-btn');
    const changeNickBtn = document.getElementById('change-nick-btn');
    const currentNickDisplay = document.getElementById('current-nick-display');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const messagesDiv = document.getElementById('messages');

    async function getKey() {
      let hash = window.location.hash.substring(1);
      if (!hash) {
        hash = Array.from(crypto.getRandomValues(new Uint8Array(16)))
          .map(b => b.toString(16).padStart(2, '0')).join('');
        window.location.hash = hash;
      }
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(hash), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("static-salt-for-room"), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function init() {
      cryptoKey = await getKey();
    }

    enterBtn.addEventListener('click', () => {
      const savedNick = localStorage.getItem('chat_nick');
      if (savedNick) {
        openChat(savedNick);
      } else {
        nickModal.classList.remove('hidden');
      }
    });

    saveNickBtn.addEventListener('click', () => {
      const val = nickInput.value.trim();
      if (val) {
        localStorage.setItem('chat_nick', val);
        nickModal.classList.add('hidden');
        openChat(val);
      }
    });

    changeNickBtn.addEventListener('click', () => {
      nickModal.classList.remove('hidden');
    });

    function openChat(nick) {
      currentNickDisplay.textContent = nick;
      startScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      msgInput.focus();
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      const nick = localStorage.getItem('chat_nick') || '?';
      if (!text || !cryptoKey) return;

      const payload = JSON.stringify({ a: nick, t: text });
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        enc.encode(payload)
      );

      socket.emit('message', {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    socket.on('message', async (packet) => {
      try {
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(packet.iv) },
          cryptoKey,
          new Uint8Array(packet.data)
        );
        const parsed = JSON.parse(new TextDecoder().decode(decrypted));
        displayMessage(parsed.a, parsed.t);
      } catch (e) {
        console.error("Błąd odszyfrowania", e);
      }
    });

    function displayMessage(author, text) {
      const myNick = localStorage.getItem('chat_nick');
      const isMe = author === myNick;

      const el = document.createElement('div');
      el.className = `msg ${isMe ? 'me' : 'other'}`;
      
      const authorEl = document.createElement('div');
      authorEl.className = 'author';
      authorEl.textContent = author;

      const textEl = document.createElement('div');
      textEl.textContent = text;

      el.appendChild(authorEl);
      el.appendChild(textEl);
      messagesDiv.appendChild(el);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    init();
  </script>
</body>
</html>
