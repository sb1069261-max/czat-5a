<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prywatny Czat</title>
    <style>
        body {
            background-color: #0f0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .profile-card {
            background: #18181d;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid #2a2a33;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .avatar-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 { 
            color: white; 
            font-size: 24px;
            margin: 15px 0 5px 0; 
        }

        .subtitle { 
            color: #888899; 
            font-style: italic; 
            font-size: 14px;
            margin-bottom: 30px; 
        }

        .action-btn {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img src="IMG_7918.jpeg" alt="Profil" class="avatar">
        </div>
        <h1>Prywatny Czat</h1>
        <p class="subtitle">„każdy chuj ma swój strój.”</p>
        <button class="action-btn" onclick="location.href='chat.html'">
            😈 RUCHAJ MNIE W RYJ HAH
        </button>
    </div>

</body>
</html>
