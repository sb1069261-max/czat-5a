<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121212">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animated Food Background */
    .food-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .food-item {
      position: absolute;
      font-size: 2rem;
      opacity: 0.15;
      animation: float 15s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }

    /* Screens */
    .screen {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    .hidden { display: none !important; }

    /* Start / Channel Selector */
    #start-screen {
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }
    .menu-card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    .menu-card h2 { font-size: 1.2rem; color: #fff; }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }
    input[type="text"]:focus { border-color: #007aff; }

    .btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }

    /* Chat Layout */
    #chat-screen { height: 100%; }
    header {
      background: #1e1e1e;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
      align-self: flex-start;
      line-height: 1.4;
    }
    .msg.me {
      background: #007aff;
      color: #fff;
      align-self: flex-end;
    }
    .msg .author {
      font-size: 0.75rem;
      font-weight: bold;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    footer {
      padding: 10px 15px;
      background: #1e1e1e;
      display: flex;
      gap: 10px;
      border-top: 1px solid #2a2a2a;
    }
    footer input { text-align: left; flex: 1; }
  </style>
</head>
<body>

  <!-- Floating Food Animations -->
  <div class="food-bg">
    <div class="food-item" style="left: 10%; animation-duration: 12s;">🍔</div>
    <div class="food-item" style="left: 30%; animation-duration: 18s; animation-delay: 2s;">🎂</div>
    <div class="food-item" style="left: 55%; animation-duration: 14s; animation-delay: 4s;">🍕</div>
    <div class="food-item" style="left: 75%; animation-duration: 16s; animation-delay: 1s;">🍟</div>
    <div class="food-item" style="left: 90%; animation-duration: 20s; animation-delay: 3s;">🍰</div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <div class="menu-card">
      <h2>Konfiguracja</h2>
      <input type="text" id="nick-input" placeholder="Wpisz inicjał/podpis (np. P)" maxlength="10">
      <button class="btn" id="save-nick-btn">Wejdź do czatu</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <span id="room-display">Czat</span>
      <button class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #333;" id="change-nick-btn">Zmień podpis</button>
    </header>
    <div id="messages"></div>
    <footer>
      <input type="text" id="msg-input" placeholder="Napisz wiadomość...">
      <button class="btn" id="send-btn">Wyślij</button>
    </footer>
  </div>

  <script>
    const socket = io();
    let cryptoKey = null;

    // Elements
    const startScreen = document.getElementById('start-screen');
    const chatScreen = document.getElementById('chat-screen');
    const nickInput = document.getElementById('nick-input');
    const saveNickBtn = document.getElementById('save-nick-btn');
    const changeNickBtn = document.getElementById('change-nick-btn');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const messagesDiv = document.getElementById('messages');

    // 1. Key Generation (from Hash)
    async function getKey() {
      let hash = window.location.hash.substring(1);
      if (!hash) {
        hash = Array.from(crypto.getRandomValues(new Uint8Array(16)))
          .map(b => b.toString(16).padStart(2, '0')).join('');
        window.location.hash = hash;
      }
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(hash), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("static-salt-for-room"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // 2. Initializing App State
    async function init() {
      cryptoKey = await getKey();
      const savedNick = localStorage.getItem('chat_nick');
      if (savedNick) {
        nickInput.value = savedNick;
        showChat();
      }
    }

    function showChat() {
      startScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      msgInput.focus();
    }

    // Save Nick
    saveNickBtn.addEventListener('click', () => {
      const val = nickInput.value.trim();
      if (val) {
        localStorage.setItem('chat_nick', val);
        showChat();
      }
    });

    changeNickBtn.addEventListener('click', () => {
      chatScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });

    // 3. Encrypt & Send
    async function sendMessage() {
      const text = msgInput.value.trim();
      const nick = localStorage.getItem('chat_nick') || '?';
      if (!text || !cryptoKey) return;

      const payload = JSON.stringify({ a: nick, t: text });
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        enc.encode(payload)
      );

      const packet = {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      };

      socket.emit('message', packet);
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // 4. Receive & Decrypt
    socket.on('message', async (packet) => {
      try {
        const iv = new Uint8Array(packet.iv);
        const data = new Uint8Array(packet.data);

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          cryptoKey,
          data
        );

        const decoded = new TextDecoder().decode(decrypted);
        const parsed = JSON.parse(decoded);
        
        displayMessage(parsed.a, parsed.t);
      } catch (e) {
        console.error("Błąd odszyfrowania", e);
      }
    });

    function displayMessage(author, text) {
      const myNick = localStorage.getItem('chat_nick');
      const isMe = author === myNick;

      const el = document.createElement('div');
      el.className = `msg ${isMe ? 'me' : ''}`;
      
      const authorEl = document.createElement('div');
      authorEl.className = 'author';
      authorEl.textContent = author;

      const textEl = document.createElement('div');
      textEl.textContent = text;

      el.appendChild(authorEl);
      el.appendChild(textEl);
      messagesDiv.appendChild(el);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    init();
  </script>
</body>
</html>
