<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Czat 5a</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f10;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* EKRAN WEJŚCIOWY */
    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                  url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .cake-btn {
      padding: 20px 40px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: transform 0.2s ease;
    }

    .cake-btn:active {
      transform: scale(0.95);
    }

    /* NAKŁADKA ANIMACJI PRZEJŚCIA */
    #transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.3) 0%, rgba(15, 15, 16, 1) 80%);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ff007f;
      border-bottom-color: #00d2ff;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* KONTENER CZATU FLEXBOX DOPASOWANY DO EKRANU */
    #chat-container {
      width: 100%;
      max-width: 500px;
      height: 100dvh;
      background: rgba(18, 18, 20, 0.95);
      display: flex;
      flex-direction: column;
      padding: 12px;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.chat-active #chat-container {
      opacity: 1;
      transform: scale(1);
    }

    .header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 22px;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ff007f, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 0;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.1);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .my-msg {
      background: linear-gradient(135deg, #007bff, #0056b3);
      align-self: flex-end;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 4px;
    }

    /* FORMULARZ ZAWSZE WIDOCZNY NA DOLE */
    form {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom, 8px);
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 16px; /* 16px zapobiega automatycznemu przybliżaniu ekranu w Safari */
      outline: none;
    }

    button.send-btn {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #28a745, #218838);
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- EKRAN WEJŚCIOWY -->
  <div id="welcome-screen">
    <button class="cake-btn" onclick="enterChat()">TYLKO TORTY</button>
  </div>

  <!-- NAKŁADKA ANIMACJI PRZEJŚCIA -->
  <div id="transition-overlay">
    <div class="spinner"></div>
  </div>

  <!-- APLIKACJA CZATU -->
  <div id="chat-container">
    <div class="header">
      <h1>CZAT 5A</h1>
    </div>
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Napisz wiadomość..." />
      <button type="submit" class="send-btn">Wyślij</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    function enterChat() {
      const welcomeScreen = document.getElementById('welcome-screen');
      const overlay = document.getElementById('transition-overlay');

      welcomeScreen.style.opacity = '0';
      welcomeScreen.style.transform = 'scale(1.1)';

      setTimeout(() => {
        welcomeScreen.style.display = 'none';
        overlay.style.opacity = '1';
      }, 400);

      setTimeout(() => {
        overlay.style.opacity = '0';
        document.body.classList.add('chat-active');
      }, 900);
    }

    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    if (!window.location.hash) {
      window.location.hash = 'room-' + Math.random().toString(36).substring(2, 9);
    }
    const roomId = window.location.hash;

    socket.emit('join-room', roomId);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        const text = input.value;
        addMessage(text, true);
        socket.emit('chat-message', { room: roomId, text: text });
        input.value = '';
      }
    });

    socket.on('chat-message', (data) => {
      addMessage(data.text, false);
    });

    function addMessage(text, isMine) {
      const item = document.createElement('div');
      item.classList.add('msg');
      if (isMine) item.classList.add('my-msg');
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
