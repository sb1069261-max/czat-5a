<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tylko Tort - Czat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
    }

    /* Ekran powitalny (Intro z Burgerem i Tortem) */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=80') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    #intro-screen h2 {
      font-size: 1rem;
      color: #ffcc00;
      margin-bottom: 15px;
      font-style: italic;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    #intro-screen h1 {
      font-size: 2.5rem;
      color: #ff5722;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    #intro-screen input {
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      width: 80%;
      max-width: 250px;
      text-align: center;
    }

    #intro-screen button {
      padding: 12px 25px;
      font-size: 1.1rem;
      background-color: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* Główny ekran czatu */
    #chat-screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      background-color: #181818;
    }

    #chat-header {
      padding: 15px;
      background-color: #222;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff5722;
      border-bottom: 1px solid #333;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 85%;
      word-break: break-word;
      font-size: 1rem;
    }

    .message.mine {
      background: #ff5722;
      align-self: flex-end;
    }

    #chat-form {
      display: flex;
      padding: 10px;
      background-color: #222;
      border-top: 1px solid #333;
    }

    #chat-input {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background-color: #333;
      color: white;
      outline: none;
    }

    #chat-send {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 0 20px;
      margin-left: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Ekran powitalny -->
  <div id="intro-screen">
    <h2>„każdy chuj ma swój strój”</h2>
    <h1>Tylko Tort</h1>
    <input type="text" id="user-initial" placeholder="Wpisz 1. literę imienia" maxlength="3">
    <button id="enter-btn">Wejdź do czatu</button>
  </div>

  <!-- Ekran czatu -->
  <div id="chat-screen">
    <div id="chat-header">Tylko Tort - Główny Kanał</div>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Napisz wiadomość..." autocomplete="off">
      <button type="submit" id="chat-send">Wyślij</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const introScreen = document.getElementById('intro-screen');
    const chatScreen = document.getElementById('chat-screen');
    const enterBtn = document.getElementById('enter-btn');
    const userInitialInput = document.getElementById('user-initial');
    
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    let userLetter = '';

    enterBtn.addEventListener('click', () => {
      const val = userInitialInput.value.trim();
      if (!val) {
        alert('Wpisz chociaż jedną literę!');
        return;
      }
      userLetter = val.toUpperCase();
      
      // Ukrywamy intro, pokazujemy czat
      introScreen.style.display = 'none';
      chatScreen.style.display = 'flex';

      // Automatyczne łączenie do wspólnego pokoju na serwerze
      socket.emit('join-room', 'main-chat');
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      const messageData = {
        sender: userLetter,
        text: text
      };

      socket.emit('message', messageData);
      chatInput.value = '';
    });

    // Odbieranie historii i wiadomości
    socket.on('history', (history) => {
      chatMessages.innerHTML = '';
      history.forEach(appendMessage);
    });

    socket.on('message', (data) => {
      appendMessage(data);
    });

    function appendMessage(data) {
      const div = document.createElement('div');
      div.classList.add('message');
      if (data.sender === userLetter) {
        div.classList.add('mine');
      }
      div.innerHTML = `<strong>[${data.sender}]</strong>: ${data.text}`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
