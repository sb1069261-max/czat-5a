<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prywatny Czat</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; transition: all 0.3s ease; }
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; }

    /* EKRAN 1: Główny przycisk startowy */
    #startScreen { text-align: center; }
    .cake-btn { background: #00ff88; color: #000; border: none; padding: 18px 32px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2); }

    /* EKRAN 2: Podaj pierwszą literę imienia */
    #nickScreen { display: none; text-align: center; max-width: 320px; width: 100%; }
    #nickScreen p { font-size: 16px; color: #ccc; margin-bottom: 15px; }
    #nickInput { background: #222; border: 1px solid #00ff88; color: #fff; padding: 12px; border-radius: 8px; font-size: 18px; text-align: center; width: 100%; margin-bottom: 12px; outline: none; }
    .enter-btn { background: #00ff88; color: #000; border: none; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; }

    /* EKRAN 3: Główny Czat */
    #chatScreen { display: none; flex-direction: column; width: 100%; height: 100%; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #333; margin-bottom: 10px; font-size: 14px; color: #aaa; }
    #chat { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #181818; }
    .msg { margin-bottom: 8px; word-break: break-word; }
    .nick { color: #00ff88; font-weight: bold; }
    .inputs { display: flex; gap: 8px; }
    #msgInput { flex: 1; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 6px; font-size: 16px; outline: none; }
    .send-btn { background: #00ff88; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- EKRAN 1 -->
  <div id="startScreen">
    <button class="cake-btn" onclick="goToNickStep()">TYLKO TORTY</button>
  </div>

  <!-- EKRAN 2 -->
  <div id="nickScreen">
    <p>Podaj pierwszą literę imienia lub podpis:</p>
    <input type="text" id="nickInput" placeholder="np. P" maxlength="10">
    <button class="enter-btn" onclick="enterChat()">Wejdź do czatu</button>
  </div>

  <!-- EKRAN 3 -->
  <div id="chatScreen">
    <div class="header">
      <span>🔒 Zaszyfrowany Czat</span>
      <span>Podpis: <b id="userNickDisplay" style="color:#00ff88;">-</b></span>
    </div>
    <div id="chat"></div>
    <div class="inputs">
      <input type="text" id="msgInput" placeholder="Wpisz wiadomość...">
      <button class="send-btn" onclick="sendMsg()">Wyślij</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const startScreen = document.getElementById('startScreen');
    const nickScreen = document.getElementById('nickScreen');
    const chatScreen = document.getElementById('chatScreen');
    const nickInput = document.getElementById('nickInput');
    const userNickDisplay = document.getElementById('userNickDisplay');
    const chat = document.getElementById('chat');
    const msgInput = document.getElementById('msgInput');

    let myNick = localStorage.getItem('chat_nick') || '';

    function goToNickStep() {
      startScreen.style.display = 'none';
      nickScreen.style.display = 'block';
      if (myNick) nickInput.value = myNick;
      nickInput.focus();
    }

    function enterChat() {
      const val = nickInput.value.trim();
      if (!val) return alert('Wpisz pierwszą literę imienia!');
      
      myNick = val;
      localStorage.setItem('chat_nick', myNick);
      userNickDisplay.textContent = myNick;

      nickScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      msgInput.focus();
    }

    // Generator / Pobieranie klucza z URL (#)
    async function getKey() {
      if (!window.location.hash) {
        const key = await window.crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
        const exported = await window.crypto.subtle.exportKey("jwk", key);
        window.location.hash = exported.k;
      }
      const k = window.location.hash.substring(1);
      return await window.crypto.subtle.importKey("jwk", { kty: "oct", k: k, alg: "A256GCM", ext: true }, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
    }

    // Szyfrowanie
    async function encrypt(text) {
      const key = await getKey();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
      return { iv: Array.from(iv), data: Array.from(new Uint8Array(ciphertext)) };
    }

    // Odszyfrowywanie
    async function decrypt(packet) {
      try {
        const key = await getKey();
        const iv = new Uint8Array(packet.iv);
        const data = new Uint8Array(packet.data);
        const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return "[Błąd odszyfrowania]";
      }
    }

    // Wysyłanie wiadomości
    async function sendMsg() {
      const text = msgInput.value.trim();
      if (!text) return;

      const payload = JSON.stringify({ nick: myNick, text: text });
      const encryptedPayload = await encrypt(payload);
      
      socket.emit('message', encryptedPayload);
      msgInput.value = '';
    }

    // Odbieranie wiadomości
    socket.on('message', async (packet) => {
      const rawText = await decrypt(packet);
      const div = document.createElement('div');
      div.className = 'msg';

      try {
        const parsed = JSON.parse(rawText);
        div.innerHTML = `<span class="nick">[${parsed.nick}]</span> ${parsed.text}`;
      } catch {
        div.textContent = rawText;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    });

    // Enter przechodzi dalej / wysyła
    nickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enterChat(); });
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });
  </script>
</body>
</html>
