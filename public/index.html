<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121212">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      background-color: #121212;
      color: #e0e0e0;
    }

    /* Floating Food Animations */
    .food-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .food-item { position: absolute; font-size: 1.8rem; opacity: 0.12; animation: float 14s infinite linear; }
    @keyframes float { 0% { transform: translateY(105vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }

    .screen { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; width: 100%; height: 100%; }
    .hidden { display: none !important; }

    /* Start Screen with Burger Background */
    #start-screen {
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.85)), 
                  url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
    }
    .start-card { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); padding: 28px 20px; border-radius: 20px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    
    .start-quote {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 20px;
      font-style: italic;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn-main { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.1s; }
    .btn-main:active { transform: scale(0.97); }

    /* Nick Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 10; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .modal { background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 16px; width: 100%; max-width: 300px; text-align: center; }
    .modal h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .modal input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.95rem; text-align: center; margin-bottom: 14px; outline: none; }

    /* Header with Central Title */
    header {
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to right, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .header-subtitle {
      font-size: 0.65rem;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 0.5px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-nick {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: none;
      color: #aaa;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Messages Container */
    #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 0.9rem; line-height: 1.35; word-break: break-word; }
    .msg.other { background: #2a2a2a; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.me { background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg .author { font-size: 0.68rem; font-weight: 700; opacity: 0.7; margin-bottom: 2px; text-transform: uppercase; }

    /* Footer / Input */
    footer { padding: 10px 12px; background: #181818; display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
    footer input { flex: 1; background: #242424; border: 1px solid #333; padding: 10px 14px; border-radius: 20px; color: #fff; font-size: 0.9rem; outline: none; }
    footer input:focus { border-color: #8b5cf6; }
    .btn-send { background: #22c55e; border: none; padding: 0 16px; border-radius: 18px; color: #fff; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn-send:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="food-bg">
    <div class="food-item" style="left: 10%; animation-duration: 12s;">🍔</div>
    <div class="food-item" style="left: 35%; animation-duration: 16s; animation-delay: 2s;">🎂</div>
    <div class="food-item" style="left: 60%; animation-duration: 13s; animation-delay: 4s;">🍕</div>
    <div class="food-item" style="left: 85%; animation-duration: 18s; animation-delay: 1s;">🍰</div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <div class="start-card">
      <div class="start-quote">„Każdy chuj ma swój strój”</div>
      <button class="btn-main" id="enter-btn">🎂 TYLKO TORTY</button>
    </div>
  </div>

  <!-- Nick Modal -->
  <div id="nick-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Podaj inicjał/podpis</h3>
      <input type="text" id="nick-input" placeholder="np. P" maxlength="10">
      <button class="btn-main" id="save-nick-btn">Wejdź do czatu</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="header-title">CZAT 5A</div>
      <div class="header-subtitle">🔒 SZYFROWANIE E2EE AKTYWNE</div>
      <button class="btn-nick" id="change-nick-btn">👤 <span id="current-nick-display">?</span></button>
    </header>
    <div id="messages"></div>
    <footer>
      <input type="text" id="msg-input" placeholder="Napisz wiadomość...">
      <button class="btn-send" id="send-btn">Wyślij</button>
    </footer>
  </div>

  <script>
    const socket = io();
    let cryptoKey = null;
    let currentRoom = window.location.hash.substring(1);

    const startScreen = document.getElementById('start-screen');
    const nickModal = document.getElementById('nick-modal');
    const chatScreen = document.getElementById('chat-screen');
    const nickInput = document.getElementById('nick-input');
    const enterBtn = document.getElementById('enter-btn');
    const saveNickBtn = document.getElementById('save-nick-btn');
    const changeNickBtn = document.getElementById('change-nick-btn');
    const currentNickDisplay = document.getElementById('current-nick-display');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const messagesDiv = document.getElementById('messages');

    async function getKey() {
      let hash = currentRoom;
      if (!hash) {
        hash = Array.from(crypto.getRandomValues(new Uint8Array(16)))
          .map(b => b.toString(16).padStart(2, '0')).join('');
        window.location.hash = hash;
        currentRoom = hash;
      }
      socket.emit('join-room', currentRoom);

      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(hash), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("static-salt-for-room"), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function init() {
      cryptoKey = await getKey();
    }

    enterBtn.addEventListener('click', () => {
      const savedNick = localStorage.getItem('chat_nick');
      if (savedNick) {
        openChat(savedNick);
      } else {
        nickModal.classList.remove('hidden');
      }
    });

    saveNickBtn.addEventListener('click', () => {
      const val = nickInput.value.trim();
      if (val) {
        localStorage.setItem('chat_nick', val);
        nickModal.classList.add('hidden');
        openChat(val);
      }
    });

    changeNickBtn.addEventListener('click', () => {
      nickModal.classList.remove('hidden');
    });

    function openChat(nick) {
      currentNickDisplay.textContent = nick;
      startScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      msgInput.focus();
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      const nick = localStorage.getItem('chat_nick') || '?';
      if (!text || !cryptoKey) return;

      const payload = JSON.stringify({ a: nick, t: text });
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        enc.encode(payload)
      );

      socket.emit('message', {
        room: currentRoom,
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    socket.on('message', async (packet) => {
      try {
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(packet.iv) },
          cryptoKey,
          new Uint8Array(packet.data)
        );
        const parsed = JSON.parse(new TextDecoder().decode(decrypted));
        displayMessage(parsed.a, parsed.t);
      } catch (e) {
        console.error("Błąd odszyfrowania", e);
      }
    });

    function displayMessage(author, text) {
      const myNick = localStorage.getItem('chat_nick');
      const isMe = author === myNick;

      const el = document.createElement('div');
      el.className = `msg ${isMe ? 'me' : 'other'}`;
      
      const authorEl = document.createElement('div');
      authorEl.className = 'author';
      authorEl.textContent = author;

      const textEl = document.createElement('div');
      textEl.textContent = text;

      el.appendChild(authorEl);
      el.appendChild(textEl);
      messagesDiv.appendChild(el);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    init();
  </script>
</body>
</html>
