<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Czat 5A - Food Theme</title>
  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --primary-color: #ff6600;
      --text-color: #e0e0e0;
      --text-secondary: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: var(--surface-color);
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      background-color: var(--surface-color);
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 85%;
      word-break: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message .author {
      font-size: 0.75rem;
      color: var(--primary-color);
      margin-bottom: 4px;
      font-weight: bold;
    }
    #form {
      display: flex;
      padding: 10px;
      background-color: var(--surface-color);
      border-top: 1px solid #333;
      gap: 10px;
    }
    #input {
      flex: 1;
      padding: 12px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #input:focus {
      border-color: var(--primary-color);
    }
    button {
      padding: 0 20px;
      background-color: var(--primary-color);
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    🍔 Czat 5A (Główny Kanał)
  </header>

  <div id="chat"></div>

  <form id="form" onsubmit="sendMessage(event)">
    <input id="input" autocomplete="off" placeholder="Napisz smacznego... (" />
    <button>Wyślij</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = io();
    let cryptoKey = null;

    // Stałe hasło szyfrujące E2EE dla całego czatu
    const STATIC_PASSWORD = "Czat5aTajneHaslo!";

    async function initCrypto() {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", 
        enc.encode(STATIC_PASSWORD), 
        "PBKDF2", 
        false, 
        ["deriveKey"]
      );
      
      cryptoKey = await crypto.subtle.deriveKey(
        { 
          name: "PBKDF2", 
          salt: enc.encode("fixed-food-salt-2026"), 
          iterations: 100000, 
          hash: "SHA-256" 
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );

      // Automatyczne dołączenie do głównego pokoju na serwerze
      socket.emit('join-room', 'main-chat');
    }

    initCrypto();

    // Odbieranie historii wiadomości po połączeniu
    socket.on('history', (history) => {
      history.forEach(packet => processMessage(packet));
    });

    // Odbieranie nowych wiadomości w czasie rzeczywistym
    socket.on('message', (packet) => {
      processMessage(packet);
    });

    async function processMessage(packet) {
      if (!cryptoKey) return;
      try {
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(packet.iv) },
          cryptoKey,
          new Uint8Array(packet.data)
        );
        const parsed = JSON.parse(new TextDecoder().decode(decrypted));
        displayMessage(parsed.author, parsed.text);
      } catch (e) {
        // Ignorujemy wiadomości zaszyfrowane innym kluczem (niepowiązane)
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text || !cryptoKey) return;

      input.value = '';

      const iv = crypto.getRandomValues(new Uint8Array(12));
      const payload = JSON.stringify({ author: 'Ty', text: text });
      const encoded = new TextEncoder().encode(payload);

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        encoded
      );

      socket.emit('message', {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      });
    }

    function displayMessage(author, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'message';
      
      div.innerHTML = `
        <div class="author">${author}</div>
        <div>${escapeHtml(text)}</div>
      `;
      
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
